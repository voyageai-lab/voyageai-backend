# Test Configuration
# This file provides test-specific properties and overrides production settings

# ---------------------------------
# Database Configuration (H2 In-Memory for Testing)
# ---------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------------------------------
# JPA Configuration
# ---------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------
# SQL Initialization (Disable for tests)
# ---------------------------------
spring.sql.init.mode=never

# ---------------------------------
# JWT Configuration (Test values)
# ---------------------------------
jwt.secret=test_jwt_secret_key_for_unit_tests_must_be_at_least_32_characters_long
jwt.expiration=86400000

# ---------------------------------
# Frontend URL (Test)
# ---------------------------------
frontend.url=http://localhost:3000

# ---------------------------------
# OAuth2 Configuration (Test - Dummy values to enable bean creation)
# ---------------------------------
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# ---------------------------------
# Logging
# ---------------------------------
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.voyageai=DEBUG

