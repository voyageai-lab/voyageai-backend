spring.application.name=voyageai-backend

# ---------------------------------
# Import Secrets Configuration
# ---------------------------------
spring.config.import=optional:classpath:application-secrets.properties

# ---------------------------------
# Server Configuration
# ---------------------------------
server.port=8081
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# ---------------------------------
# DataSource (MySQL 8)
# If using Docker with port 3306, use localhost:3306
# Modify username/password according to your setup
# allowPublicKeyRetrieval=true: prevents handshake failures in some environments
# serverTimezone=UTC: avoids timezone warnings
# ---------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/voyageai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Password is loaded from application-secrets.properties (gitignored)
spring.datasource.password=${db.password}

# Hikari Connection Pool (adjust as needed)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# ---------------------------------
# JPA / Hibernate Configuration
# ddl-auto=validate: validates schema against entities but doesn't modify it
# show-sql=false: prevents SQL logging in console (set to true when debugging)
# dialect: explicitly specify MySQL8Dialect for stability (can be auto-detected)
# ---------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL initialization
# Mode options:
#   - always: run schema.sql every time (use with CREATE TABLE IF NOT EXISTS)
#   - embedded: only run for embedded databases (H2, HSQL)
#   - never: don't run schema.sql
# For development with Docker MySQL: use "always" for first setup, then change to "never"
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ---------------------------------
# OAuth2 Client (Google) - OPTIONAL
# To enable Google OAuth, configure credentials in application-secrets.properties
# 
# To obtain credentials:
#   1. Go to https://console.cloud.google.com/apis/credentials
#   2. Create OAuth 2.0 Client ID (Web application)
#   3. Add authorized redirect URI: http://localhost:8081/login/oauth2/code/google
# 
# User initiates OAuth flow by visiting: /oauth2/authorization/google
# After successful authentication, user is redirected to frontend with JWT token
# 
# Uncomment below to enable OAuth2 (requires application-secrets.properties)
# ---------------------------------
spring.security.oauth2.client.registration.google.client-id=${google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${google.client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# ---------------------------------
# JWT Configuration
# Secret is loaded from application-secrets.properties (gitignored)
# ---------------------------------
jwt.secret=${jwt.secret}
jwt.expiration=86400000

# ---------------------------------
# Frontend URL (for OAuth redirect)
# ---------------------------------
frontend.url=http://localhost:3000

# ---------------------------------
# NoSQL Storage Provider Configuration
# ---------------------------------
# Switch between MongoDB and DynamoDB:
#   mongodb  - Platform-agnostic, recommended for most deployments
#   dynamodb - AWS-specific, use for AWS-native architecture
storage.nosql.provider=mongodb

# ---------------------------------
# MongoDB Configuration (Default NoSQL Provider)
# ---------------------------------
# MongoDB connection URI
spring.data.mongodb.uri=mongodb://localhost:27017/voyageai
# MongoDB database name
spring.data.mongodb.database=voyageai
# Auto-create indexes
spring.data.mongodb.auto-index-creation=true

# ---------------------------------
# AWS Configuration (DynamoDB - Alternative NoSQL Provider)
# ---------------------------------
# Set storage.nosql.provider=dynamodb to use DynamoDB instead of MongoDB
# AWS region where DynamoDB table is created
aws.region=us-east-1

# DynamoDB endpoint override for local development (LocalStack)
# For local development: use LocalStack (http://localhost:4566)
# For production: comment out this line to use real AWS DynamoDB
aws.dynamodb.endpoint=http://localhost:4566

# AWS credentials (only needed for real AWS, not for LocalStack)
# For LocalStack: any dummy values work (test/test)
# For production: use IAM roles or AWS Secrets Manager
aws.access-key-id=${aws.access-key-id}
aws.secret-access-key=${aws.secret-access-key}

# ---------------------------------
# Logging Configuration (enable for debugging)
# ---------------------------------
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.software.amazon.awssdk=INFO

# ---------------------------------
# OpenAI API Configuration
# ---------------------------------
# OpenAI API key loaded from application-secrets.properties (gitignored)
openai.api.key=${openai.api.key}
# OpenAI API endpoint
openai.api.url=https://api.openai.com/v1/chat/completions
# Model selection (gpt-4, gpt-4-turbo, gpt-3.5-turbo)
# Note: gpt-4-turbo is required for response_format: "json_object" support
openai.model=gpt-4-turbo
# Temperature for response randomness (0.0 = deterministic, 2.0 = very random)
openai.temperature=0.7
# Maximum tokens in response
openai.max-tokens=2000

# ---------------------------------
# Redis Configuration
# ---------------------------------
# Redis server hostname
spring.data.redis.host=localhost
# Redis server port
spring.data.redis.port=6379
# Redis database index (0-15)
spring.data.redis.database=0
# Connection timeout
spring.data.redis.timeout=2000ms
# Connection pool settings
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
# Task TTL (Time To Live) in hours
task.ttl.hours=24

# ---------------------------------
# Conversation History Configuration
# ---------------------------------
# Maximum number of messages to keep in Redis cache per project
conversation.history.max.messages=50
# Redis TTL for conversation history (in days)
conversation.history.ttl.days=7

# ---------------------------------
# Server-Sent Events (SSE) Configuration
# ---------------------------------
# SSE connection timeout in seconds (60 seconds default)
sse.timeout.seconds=60

# ---------------------------------
# Kafka Configuration (Module 11)
# ---------------------------------
# Kafka broker address (KRaft mode, no ZooKeeper)
spring.kafka.bootstrap-servers=localhost:9092
# Consumer group for the Java backend
spring.kafka.consumer.group-id=voyageai-java
# Planning pipeline topics
kafka.topic.planning.request=planning.request
kafka.topic.planning.progress=planning.progress
kafka.topic.planning.result=planning.result
# Planning mode: "kafka" (via Kafka pipeline) or "async" (direct @Async, legacy)
planning.mode=kafka

# ---------------------------------
# Python AI Service Configuration
# ---------------------------------
# Base URL for the Python AI service (used in async fallback mode)
python.service.url=http://localhost:8000

# ---------------------------------
# Google Maps API Configuration (Optional)
# ---------------------------------
# Google Maps/Places API key (optional, for location enrichment)
# If not configured, AI-generated coordinates will be used
# Get your API key from: https://console.cloud.google.com/apis/credentials
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

# ---------------------------------
# Spring Boot Actuator (Module 13)
# ---------------------------------
# Expose health, info, and metrics endpoints
management.endpoints.web.exposure.include=health,info,metrics
# Show full health details (including Kafka, Redis, MongoDB indicators)
management.endpoint.health.show-details=when-authorized
# Separate liveness and readiness probes for K8s
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ---------------------------------
# Graceful Shutdown (Module 13)
# ---------------------------------
# Wait for in-flight requests to complete before shutting down
server.shutdown=graceful
# Maximum wait time for graceful shutdown (30 seconds)
spring.lifecycle.timeout-per-shutdown-phase=30s

# ---------------------------------
# Rate Limiting (Module 13)
# ---------------------------------
# Maximum planning requests per minute per user
rate.limit.requests-per-minute=10
# Timeout for rate limit acquisition (0 = fail immediately)
rate.limit.timeout-ms=0
