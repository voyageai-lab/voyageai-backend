spring.application.name=voyageai-backend
# ---------------------------------
# Server Configuration
# ---------------------------------
server.port=8081
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# ---------------------------------
# DataSource (MySQL 8)
# If using Docker with port 3306, use localhost:3306
# Modify username/password according to your setup
# allowPublicKeyRetrieval=true: prevents handshake failures in some environments
# serverTimezone=UTC: avoids timezone warnings
# ---------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/voyageai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=RootPwd!

# Hikari Connection Pool (adjust as needed)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# ---------------------------------
# JPA / Hibernate Configuration
# ddl-auto=update: automatically creates/updates tables based on entities (OK for development; use Flyway/Liquibase for production)
# show-sql=false: prevents SQL logging in console (set to true when debugging)
# dialect: explicitly specify MySQL8Dialect for stability (can be auto-detected)
# ---------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ---------------------------------
# OAuth2 Client (Google)
# To enable Google OAuth, set the following environment variables:
#   export GOOGLE_CLIENT_ID=your_client_id
#   export GOOGLE_CLIENT_SECRET=your_client_secret
# 
# To obtain credentials:
#   1. Go to https://console.cloud.google.com/apis/credentials
#   2. Create OAuth 2.0 Client ID (Web application)
#   3. Add authorized redirect URI: http://localhost:8081/login/oauth2/code/google
# 
# User initiates OAuth flow by visiting: /oauth2/authorization/google
# After successful authentication, user is redirected to frontend with JWT token
# ---------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# ---------------------------------
# JWT Configuration
# ---------------------------------
jwt.secret=mySecretKeyForJWT123456789012345678901234567890
jwt.expiration=86400000

# ---------------------------------
# Frontend URL (for OAuth redirect)
# ---------------------------------
frontend.url=http://localhost:3000

# ---------------------------------
# Logging Configuration (enable for debugging)
# ---------------------------------
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
