spring.application.name=voyageai-backend
# ---------------------------------
# Server
# ---------------------------------
server.port=8081

# ---------------------------------
# DataSource (MySQL 8)
# ?? Docker ???? 3306?????? 3306????/???????????
# allowPublicKeyRetrieval=true ????????????
# serverTimezone=UTC ????????
# ---------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/voyageai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=RootPwd!

# Hikari ??????????
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# ---------------------------------
# JPA / Hibernate
# ddl-auto=update: ???????/????????? OK????? Flyway/Liquibase?
# show-sql=false: ?????? SQL??????? true?
# dialect ????Hibernate ????????????????? MySQL8Dialect
# ---------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ---------------------------------
# OAuth2 Client (Google)
# client-id / client-secret ?????????????????????
# scope ????????
# redirect-uri ???? {baseUrl}/login/oauth2/code/{registrationId}
# provider.google.issuer-uri ?? OpenID Connect ????
# ---------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# ?????????????????/oauth2/authorization/google
# ?? SecurityConfig ? .oauth2Login().loginPage(...) ??
# spring.security.oauth2.client.registration.google.client-name=Google

# ---------------------------------
# Logging??????????
# ---------------------------------
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
