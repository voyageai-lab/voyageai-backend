spring.application.name=voyageai-backend
# ---------------------------------
# Server Configuration
# ---------------------------------
server.port=8081

# ---------------------------------
# DataSource (MySQL 8)
# If using Docker with port 3306, use localhost:3306
# Modify username/password according to your setup
# allowPublicKeyRetrieval=true: prevents handshake failures in some environments
# serverTimezone=UTC: avoids timezone warnings
# ---------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/voyageai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=RootPwd!

# Hikari Connection Pool (adjust as needed)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# ---------------------------------
# JPA / Hibernate Configuration
# ddl-auto=update: automatically creates/updates tables based on entities (OK for development; use Flyway/Liquibase for production)
# show-sql=false: prevents SQL logging in console (set to true when debugging)
# dialect: explicitly specify MySQL8Dialect for stability (can be auto-detected)
# ---------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ---------------------------------
# OAuth2 Client (Google)
# client-id / client-secret: recommended to inject via environment variables (not hardcode)
# scope: multiple values separated by commas
# redirect-uri: template format {baseUrl}/login/oauth2/code/{registrationId}
# provider.google.issuer-uri: uses OpenID Connect discovery endpoint
# ---------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# (Optional) Custom login page trigger URL: /oauth2/authorization/google
# Use with SecurityConfig .oauth2Login().loginPage(...)
# spring.security.oauth2.client.registration.google.client-name=Google

# ---------------------------------
# Logging Configuration (enable for debugging)
# ---------------------------------
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
