spring.application.name=voyageai-backend
# ---------------------------------
# Server Configuration
# ---------------------------------
server.port=8081
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# ---------------------------------
# DataSource (MySQL 8)
# If using Docker with port 3306, use localhost:3306
# Modify username/password according to your setup
# allowPublicKeyRetrieval=true: prevents handshake failures in some environments
# serverTimezone=UTC: avoids timezone warnings
# ---------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/voyageai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Password is loaded from application-secrets.properties (gitignored)
spring.datasource.password=${spring.datasource.password}

# Hikari Connection Pool (adjust as needed)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# ---------------------------------
# JPA / Hibernate Configuration
# ddl-auto=validate: validates schema against entities but doesn't modify it
# show-sql=false: prevents SQL logging in console (set to true when debugging)
# dialect: explicitly specify MySQL8Dialect for stability (can be auto-detected)
# ---------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# SQL initialization
# Mode options:
#   - always: run schema.sql every time (use with CREATE TABLE IF NOT EXISTS)
#   - embedded: only run for embedded databases (H2, HSQL)
#   - never: don't run schema.sql
# For development with Docker MySQL: use "always" for first setup, then change to "never"
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ---------------------------------
# OAuth2 Client (Google) - OPTIONAL
# To enable Google OAuth, configure credentials in application-secrets.properties
# 
# To obtain credentials:
#   1. Go to https://console.cloud.google.com/apis/credentials
#   2. Create OAuth 2.0 Client ID (Web application)
#   3. Add authorized redirect URI: http://localhost:8081/login/oauth2/code/google
# 
# User initiates OAuth flow by visiting: /oauth2/authorization/google
# After successful authentication, user is redirected to frontend with JWT token
# 
# Uncomment below to enable OAuth2 (requires application-secrets.properties)
# ---------------------------------
# spring.security.oauth2.client.registration.google.client-id=${google.client-id}
# spring.security.oauth2.client.registration.google.client-secret=${google.client-secret}
# spring.security.oauth2.client.registration.google.scope=openid,profile,email
# spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
#
# spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# ---------------------------------
# JWT Configuration
# Secret is loaded from application-secrets.properties (gitignored)
# ---------------------------------
jwt.secret=${jwt.secret}
jwt.expiration=86400000

# ---------------------------------
# Frontend URL (for OAuth redirect)
# ---------------------------------
frontend.url=http://localhost:3000

# ---------------------------------
# Logging Configuration (enable for debugging)
# ---------------------------------
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
