apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voyageai-ingress
  namespace: voyageai
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # SSE support - disable buffering
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: voyageai.local
      http:
        paths:
          # Frontend (default)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          # Java Backend API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: java-backend
                port:
                  number: 8081
          # Actuator health (for monitoring)
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: java-backend
                port:
                  number: 8081
