apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-worker
  namespace: voyageai
  labels:
    app: python-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-worker
  template:
    metadata:
      labels:
        app: python-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: python-worker
          image: voyageai/python-worker:latest
          envFrom:
            - configMapRef:
                name: voyageai-config
            - secretRef:
                name: voyageai-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Worker has no HTTP server, use exec probe
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import redis; r = redis.from_url('redis://redis:6379/0', socket_timeout=2); r.ping()"
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
