apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-backend
  namespace: voyageai
  labels:
    app: java-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-backend
  template:
    metadata:
      labels:
        app: java-backend
    spec:
      containers:
        - name: java-backend
          image: voyageai/java-backend:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: voyageai-config
            - secretRef:
                name: voyageai-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: java-backend
  namespace: voyageai
spec:
  selector:
    app: java-backend
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
