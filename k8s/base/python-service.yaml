apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
  namespace: voyageai
  labels:
    app: python-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-service
  template:
    metadata:
      labels:
        app: python-service
    spec:
      containers:
        - name: python-service
          image: voyageai/python-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: voyageai-config
            - secretRef:
                name: voyageai-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: voyageai
spec:
  selector:
    app: python-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
